# This workflow generates an activity graph for the user Lluciocc and publishes it to the gh-pages branch.

name: Generate activity graph

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server
        run: npm run build

      - name: Start server
        env:
          TOKEN: ${{ secrets.GRAPH_TOKEN }}
          PORT: 5100
        run: |
          node dist/main.js > server.log 2>&1 &
          echo $! > server.pid

          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5100/ > /dev/null; then
              echo "Server is ready"
              exit 0
            fi

            sleep 1
          done

          echo "Server failed to start"
          cat server.log
          exit 1

      - name: Generate SVG
        run: |
          curl --fail \
            "http://127.0.0.1:5100/graph?username=Lluciocc&bg_color=0D1117&color=C4B5FD&line=8B5CF6&point=A78BFA&area=true&area_color=4F46E5&hide_border=true&custom_title=Lluciocc%27s%20Contribution%20Activity" \
            --output /tmp/activity-graph.svg

          test -s /tmp/activity-graph.svg

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Publish SVG to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan generated-graph
          git rm -rf .

          cp /tmp/activity-graph.svg activity-graph.svg

          git add activity-graph.svg
          git commit -m "Update activity graph"
          git push --force origin HEAD:gh-pages